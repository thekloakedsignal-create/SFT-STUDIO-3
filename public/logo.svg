<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Cosmic Background Gradient -->
    <radialGradient id="cosmicBgLogo" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="40%" stop-color="#022c22" />
      <stop offset="85%" stop-color="#020617" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Golden Metallic Triangle Gradient -->
    <linearGradient id="goldGradLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Emerald Nebula Core Gradient -->
    <radialGradient id="nebulaCoreLogo" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#10b981" stop-opacity="0.6" />
      <stop offset="80%" stop-color="#064e3b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <!-- Intense Glow Filter -->
    <filter id="glowGoldLogo" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowEmeraldLogo" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Cosmic Canvas -->
  <rect width="512" height="512" rx="100" fill="url(#cosmicBgLogo)" />

  <!-- Stars & Dust Particles -->
  <circle cx="120" cy="90" r="2" fill="#fef08a" opacity="0.6" />
  <circle cx="390" cy="110" r="2.5" fill="#34d399" opacity="0.7" />
  <circle cx="80" cy="380" r="1.5" fill="#ffffff" opacity="0.5" />
  <circle cx="430" cy="420" r="2" fill="#f59e0b" opacity="0.6" />

  <!-- Central Swirling Emerald Nebula -->
  <circle cx="256" cy="275" r="110" fill="url(#nebulaCoreLogo)" filter="url(#glowEmeraldLogo)" />

  <!-- Nebula Spiral Rings -->
  <path d="M 256,190 A 85,85 0 1,1 171,275" fill="none" stroke="#34d399" stroke-width="3.5" stroke-dasharray="16 8" opacity="0.7" />
  <path d="M 256,220 A 55,55 0 1,1 201,275" fill="none" stroke="#6ee7b7" stroke-width="3" stroke-dasharray="10 6" opacity="0.8" />
  <path d="M 256,245 A 30,30 0 1,1 226,275" fill="none" stroke="#fef08a" stroke-width="2.5" opacity="0.9" />
  <circle cx="256" cy="275" r="8" fill="#fef08a" filter="url(#glowGoldLogo)" />

  <!-- Outer Glowing Gold Triangle Frame -->
  <polygon points="256,70 436,380 76,380" fill="none" stroke="url(#goldGradLogo)" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" filter="url(#glowGoldLogo)" />
  <polygon points="256,70 436,380 76,380" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6" stroke-linejoin="round" />

  <!-- Vertex Bright Nodes -->
  <circle cx="256" cy="70" r="12" fill="#fef08a" filter="url(#glowGoldLogo)" />
  <circle cx="436" cy="380" r="12" fill="#f59e0b" filter="url(#glowGoldLogo)" />
  <circle cx="76" cy="380" r="12" fill="#34d399" filter="url(#glowEmeraldLogo)" />

  <!-- Text along Left Side: TRIADIC -->
  <g transform="translate(150, 220) rotate(-60)">
    <text x="0" y="0" text-anchor="middle" font-family="'Times New Roman', Georgia, serif" font-weight="bold" font-size="20" fill="#fef08a" letter-spacing="4" filter="url(#glowGoldLogo)">TRIADIC</text>
  </g>

  <!-- Text along Right Side: INTELLIGENCE -->
  <g transform="translate(362, 220) rotate(60)">
    <text x="0" y="0" text-anchor="middle" font-family="'Times New Roman', Georgia, serif" font-weight="bold" font-size="18" fill="#fef08a" letter-spacing="3" filter="url(#glowGoldLogo)">INTELLIGENCE</text>
  </g>

  <!-- Text along Bottom Side: LABS -->
  <g transform="translate(256, 420)">
    <text x="0" y="0" text-anchor="middle" font-family="'Times New Roman', Georgia, serif" font-weight="bold" font-size="22" fill="#34d399" letter-spacing="6" filter="url(#glowEmeraldLogo)">LABS</text>
  </g>
</svg>
